version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  brief:
    format: "%(levelname)-8s | %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: brief
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: standard
    filename: logs/project.log
    maxBytes: 5_242_880
    backupCount: 3
    encoding: utf-8

root:
  level: DEBUG
  handlers: [console, file]

loggers:
  optuna:
    level: WARNING
    propagate: false
  matplotlib:
    level: WARNING
    propagate: false
  numexpr:
    level: WARNING
    propagate: false