[project]
name = "stock-prices-prediction"
version = "0.1.0"
description = "Sberbank stock close prices prediction for my scientific research work"
authors = [
    {name = "Alex Davidchuk"}
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy (>=2.3.3,<3.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "xgboost (>=3.0.5,<4.0.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "ipykernel (>=7.0.0,<8.0.0)",
    "ta-lib (>=0.6.7,<0.7.0)",
    "optuna (>=4.5.0,<5.0.0)",
    "ipywidgets (>=8.1.7,<9.0.0)",
    "graphviz (>=0.21,<0.22)",
    "cmaes (>=0.12.0,<0.13.0)",
    "torch (>=2.9.1,<3.0.0)",
    "lxml (>=6.0.2,<7.0.0)",
    "pyarrow (>=23.0.1,<24.0.0)",
    "fastparquet (>=2025.12.0,<2026.0.0)",
    "mlflow (>=3.10.0,<4.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
